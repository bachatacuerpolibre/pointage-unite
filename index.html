<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pointage des cours à l'unité</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .sous-titre {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #777;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
    }

    .boutons-paiement {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .bouton-paiement {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 16px;
    }

    .bouton-paiement.selectionne {
      background: #222;
      color: white;
      border-color: #222;
    }

    .eleve {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      display: none;
    }

    .eleve strong {
      font-size: 18px;
    }

    button.enregistrer {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button.enregistrer:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .message.succes {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .message.erreur {
      background: #ffebee;
      color: #b71c1c;
    }

    .separateur {
      margin: 25px 0;
      border: none;
      border-top: 1px solid #ddd;
    }

    .petit-texte {
      font-size: 13px;
      color: #777;
      margin-top: 6px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>
      Pointage des cours à l'unité
    </h1>

    <div class="sous-titre">
      Enregistrement des présences
    </div>


    <!-- QR TOKEN -->

    <label for="token">
      QR Token
    </label>

    <input
      type="text"
      id="token"
      placeholder="Scanner ou saisir le QR Token"
      autocomplete="off"
    >

    <div class="petit-texte">
      Vous pouvez scanner le QR code ou saisir le token manuellement.
    </div>


    <!-- SCANNER -->

    <div id="reader"></div>


    <!-- ELEVE -->

    <div
      id="eleve"
      class="eleve"
    >

      Élève identifié :

      <br>

      <strong id="nomEleve"></strong>

    </div>


    <hr class="separateur">


    <!-- COURS -->

    <label for="cours">
      Cours
    </label>

    <select id="cours">

      <option value="">
        Sélectionner un cours
      </option>

    </select>


    <!-- MODE DE PAIEMENT -->

    <label>
      Mode de paiement
    </label>

    <div class="boutons-paiement">

      <button
        type="button"
        class="bouton-paiement"
        data-mode="Cash"
      >
        Cash
      </button>

      <button
        type="button"
        class="bouton-paiement"
        data-mode="Virement"
      >
        Virement
      </button>

    </div>


    <!-- TARIF -->

    <label for="tarif">
      Tarif appliqué
    </label>

    <input
      type="number"
      id="tarif"
      min="0"
      step="0.01"
      placeholder="Ex. 15.00"
    >

    <div class="petit-texte">
      Saisissez le montant réellement payé.
    </div>


    <!-- BOUTON -->

    <button
      id="boutonEnregistrer"
      class="enregistrer"
      disabled
    >
      ENREGISTRER LA PRÉSENCE
    </button>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>

  </div>


<script>

  /*************************************************
   * URL DE L'APPLICATION GOOGLE APPS SCRIPT
   *************************************************/

  const API_URL =
    "https://script.google.com/macros/s/AKfycby6jWUmTBkw7syeYhQLErASXJ4RYMWg2qLymORzodC5r3VUHpkf7Nh1MRMsG4mH6tM5Bg/exec";


  /*************************************************
   * VARIABLES
   *************************************************/

  let eleve = null;

  let modePaiement = "";

  let traitement = false;

  let scanner = null;


  /*************************************************
   * CHARGEMENT DES COURS
   *************************************************/

  function chargerCours() {

    fetch(API_URL + "?action=cours")
      .then(response => response.json())
      .then(cours => {

        const select =
          document.getElementById("cours");

        cours.forEach(c => {

          const option =
            document.createElement("option");

          option.value = c.id;

          option.textContent =
            c.nom + " — " + c.horaire;

          select.appendChild(option);

        });

      })
      .catch(erreur => {

        afficherMessage(
          "Impossible de charger les cours.",
          false
        );

        console.error(erreur);

      });

  }


  /*************************************************
   * RECHERCHE ELEVE
   *************************************************/

  function rechercherEleve() {

    const token =
      document.getElementById("token").value.trim();

    if (!token) {
      return;
    }

    fetch(
      API_URL +
      "?action=eleve&token=" +
      encodeURIComponent(token)
    )

      .then(response => response.json())

      .then(resultat => {

        if (!resultat.ok) {

          eleve = null;

          document
            .getElementById("eleve")
            .style.display = "none";

          afficherMessage(
            resultat.message,
            false
          );

          mettreAJourBouton();

          return;
        }

        eleve = resultat;

        document
          .getElementById("nomEleve")
          .textContent =
          resultat.nomComplet;

        document
          .getElementById("eleve")
          .style.display = "block";

        afficherMessage(
          "Élève identifié.",
          true
        );

        mettreAJourBouton();

      })

      .catch(erreur => {

        afficherMessage(
          "Erreur lors de la recherche de l'élève.",
          false
        );

        console.error(erreur);

      });

  }


  /*************************************************
   * SCAN QR
   *************************************************/

  function onScanSuccess(decodedText) {

    if (traitement) {
      return;
    }

    traitement = true;

    document
      .getElementById("token")
      .value = decodedText;

    rechercherEleve();

    setTimeout(() => {

      traitement = false;

    }, 3000);

  }


  /*************************************************
   * INITIALISATION SCANNER
   *************************************************/

  function initialiserScanner() {

    scanner =
      new Html5Qrcode("reader");

    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess

    )

    .catch(erreur => {

      console.error(
        "Impossible d'activer la caméra :",
        erreur
      );

    });

  }


  /*************************************************
   * MODE DE PAIEMENT
   *************************************************/

  document
    .querySelectorAll(".bouton-paiement")
    .forEach(bouton => {

      bouton.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(".bouton-paiement")
            .forEach(b => {

              b.classList.remove(
                "selectionne"
              );

            });

          this.classList.add(
            "selectionne"
          );

          modePaiement =
            this.dataset.mode;

          mettreAJourBouton();

        }
      );

    });


  /*************************************************
   * TOKEN SAISI MANUELLEMENT
   *************************************************/

  document
    .getElementById("token")
    .addEventListener(
      "change",
      rechercherEleve
    );


  /*************************************************
   * CONTROLE DU BOUTON
   *************************************************/

  document
    .getElementById("cours")
    .addEventListener(
      "change",
      mettreAJourBouton
    );

  document
    .getElementById("tarif")
    .addEventListener(
      "input",
      mettreAJourBouton
    );


  function mettreAJourBouton() {

    const cours =
      document.getElementById("cours").value;

    const tarif =
      document.getElementById("tarif").value;

    const bouton =
      document.getElementById(
        "boutonEnregistrer"
      );

    bouton.disabled = !(
      eleve &&
      cours &&
      modePaiement &&
      tarif !== ""
    );

  }


  /*************************************************
   * ENREGISTRER LA PRESENCE
   *************************************************/

  document
    .getElementById("boutonEnregistrer")
    .addEventListener(
      "click",
      enregistrerPresence
    );


  function enregistrerPresence() {

    if (!eleve) {
      return;
    }

    const cours =
      document.getElementById("cours").value;

    const tarif =
      document.getElementById("tarif").value;

    const bouton =
      document.getElementById(
        "boutonEnregistrer"
      );

    bouton.disabled = true;

    afficherMessage(
      "Enregistrement en cours...",
      true
    );


    const donnees = {

      token: eleve.token,

      idCours: cours,

      modePaiement: modePaiement,

      tarif: tarif

    };


    fetch(API_URL, {

      method: "POST",

      body: JSON.stringify(donnees)

    })

      .then(response => response.json())

      .then(resultat => {

        if (!resultat.ok) {

          afficherMessage(
            resultat.message,
            false
          );

          mettreAJourBouton();

          return;
        }


        afficherMessage(
          "Présence enregistrée avec succès.",
          true
        );


        /*******************************************
         * RESET
         *******************************************/

        document
          .getElementById("token")
          .value = "";

        document
          .getElementById("cours")
          .value = "";

        document
          .getElementById("tarif")
          .value = "";

        document
          .getElementById("eleve")
          .style.display = "none";

        document
          .querySelectorAll(
            ".bouton-paiement"
          )
          .forEach(b => {

            b.classList.remove(
              "selectionne"
            );

          });

        eleve = null;

        modePaiement = "";

        mettreAJourBouton();

      })

      .catch(erreur => {

        afficherMessage(
          "Erreur lors de l'enregistrement.",
          false
        );

        console.error(erreur);

        mettreAJourBouton();

      });

  }


  /*************************************************
   * MESSAGES
   *************************************************/

  function afficherMessage(
    texte,
    succes
  ) {

    const element =
      document.getElementById("message");

    element.textContent = texte;

    element.className =
      "message " +
      (succes ? "succes" : "erreur");

    element.style.display = "block";

  }


  /*************************************************
   * INITIALISATION
   *************************************************/

  chargerCours();

  initialiserScanner();

</script>

</body>

</html>
